<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imposteur</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--line:#2a2e3b;--txt:#e8e8ee;--mut:#9095a8;--acc:#e5484d;--btn:#2b6cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:560px}
h1{font-size:28px;margin:0 0 4px}h1 span{color:var(--acc)}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#11131a;color:var(--txt);font-size:16px}
button{padding:12px 16px;border:0;border-radius:8px;background:var(--btn);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
button:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
button.red{background:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.cats button{flex:1 1 45%;background:#232735;border:2px solid transparent}
.tabs button{flex:1;background:#232735;border:2px solid transparent}
.tabs button.sel{border-color:var(--acc);background:#3a1d22}
.turn{text-align:center;border-color:var(--btn)}
.turn.mine{border-color:var(--acc);background:#2a1a1e}
.tname{font-size:22px;font-weight:700;margin:4px 0}
.cats button.sel{border-color:var(--btn);background:#1f2a4a}
.players{list-style:none;padding:0;margin:0}
.players li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.word{font-size:34px;font-weight:800;text-align:center;padding:24px 0}
.mut{color:var(--mut);font-size:14px}
.link{word-break:break-all;background:#11131a;padding:10px;border-radius:8px;font-size:14px}
.vote button{display:block;width:100%;text-align:left;background:#232735}
.vote button.sel{background:var(--acc)}
.err{color:var(--acc)}
#msgs{height:220px;overflow-y:auto;margin:10px 0;padding:8px;background:#11131a;border-radius:8px;font-size:15px}
#msgs p{margin:0 0 6px;word-wrap:break-word}
#msgs b{color:#8ab4ff}
#msgs .mine b{color:var(--acc)}
.result{font-size:30px;font-weight:800;text-align:center;padding:16px;border-radius:12px;margin-bottom:14px}
.win{background:#123d2a;color:#3dd68c}
.lose{background:#3d1416;color:var(--acc)}
.tag{font-size:12px;background:#2a2e3b;padding:2px 8px;border-radius:99px;margin-left:6px}
</style>
</head>
<body>
<main>
<h1>L'<span>Imposteur</span></h1>
<p class="sub">Tout le monde a le même mot… sauf un.</p>
<div id="app"><div class="card mut">Chargement…</div></div>
<div id="chat" class="card" hidden>
 <b>💬 Chat</b>
 <div id="msgs"></div>
 <form id="cf" class="row"><input id="ci" maxlength="200" placeholder="Écris un message…" autocomplete="off" style="flex:1"><button style="margin:0">Envoyer</button></form>
</div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,get,set,update,onValue,onDisconnect,push,query,limitToLast} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const db=getDatabase(initializeApp({databaseURL:"https://imposteur-9c143-default-rtdb.europe-west1.firebasedatabase.app"}));

// ===== Paires de mots (proches mais différents) =====
const CATS={
 "Animes":"Naruto|Bleach,One Piece|Fairy Tail,Death Note|Code Geass,Attack on Titan|Tokyo Ghoul,Dragon Ball Z|Dragon Ball Super,Hunter x Hunter|Jujutsu Kaisen,Demon Slayer|Jujutsu Kaisen,My Hero Academia|One Punch Man,Fullmetal Alchemist|Fire Force,Sword Art Online|Log Horizon,Haikyuu|Kuroko no Basket,Chainsaw Man|Hell's Paradise,Spy x Family|Kaguya-sama,Vinland Saga|Berserk,Dr. Stone|Fullmetal Alchemist,Black Clover|Fairy Tail,Mob Psycho 100|One Punch Man,Solo Leveling|Sword Art Online,Blue Lock|Captain Tsubasa,Pokémon|Digimon",
 "Personnages LoL":"Ahri|Lux,Yasuo|Yone,Garen|Darius,Ashe|Sejuani,Jinx|Vi,Zed|Shen,Thresh|Blitzcrank,Lee Sin|Udyr,Teemo|Rumble,Katarina|Talon,Ezreal|Lucian,Caitlyn|Jhin,Annie|Brand,Morgana|Kayle,Nasus|Renekton,Riven|Fiora,Leona|Diana,Master Yi|Tryndamere,Draven|Darius,Kai'Sa|Kha'Zix,Malphite|Galio,Sona|Seraphine",
 "Objets":"Fourchette|Cuillère,Chaise|Tabouret,Stylo|Crayon,Téléphone|Tablette,Oreiller|Coussin,Brosse à dents|Peigne,Lampe|Bougie,Montre|Bracelet,Valise|Sac à dos,Tasse|Verre,Ciseaux|Couteau,Clé|Cadenas,Parapluie|Imperméable,Miroir|Fenêtre,Casque|Écouteurs,Clavier|Manette,Réfrigérateur|Congélateur,Marteau|Tournevis,Livre|Cahier,Ballon|Raquette,Tapis|Serviette,Bouteille|Gourde",
 "Jeux vidéo":"League of Legends|Dota 2,Rocket League|FIFA,Fortnite|PUBG,Minecraft|Terraria,Call of Duty|Battlefield,GTA V|Red Dead Redemption,Valorant|Counter-Strike,The Witcher 3|Skyrim,Mario Kart|Crash Team Racing,Dofus|Wakfu,Overwatch|Apex Legends,Elden Ring|Dark Souls,Pokémon|Yu-Gi-Oh,Clash Royale|Clash of Clans,Among Us|Fall Guys,Zelda|Final Fantasy,Hollow Knight|Celeste,Tetris|Candy Crush,Street Fighter|Tekken,Rematch|Rocket League,World of Warcraft|Dofus",
 "Animaux":"Lion|Tigre,Chien|Loup,Chat|Lynx,Cheval|Âne,Vache|Taureau,Mouton|Chèvre,Aigle|Faucon,Requin|Dauphin,Baleine|Orque,Crocodile|Alligator,Grenouille|Crapaud,Abeille|Guêpe,Papillon|Mite,Corbeau|Pie,Hibou|Chouette,Lapin|Lièvre,Souris|Rat,Singe|Gorille,Zèbre|Girafe,Ours|Panda,Pingouin|Manchot,Escargot|Limace,Tortue|Lézard,Renard|Chacal,Chameau|Dromadaire,Poule|Canard,Serpent|Ver de terre,Éléphant|Hippopotame",
 "Personnages Dofus":"Iop|Sacrieur,Crâ|Ouginak,Eniripsa|Sadida,Sram|Roublard,Xélor|Eliotrope,Ecaflip|Enutrof,Féca|Pandawa,Osamodas|Sadida,Zobal|Steamer,Huppermage|Xélor,Bouftou|Tofu,Bouftou royal|Tofu royal,Arakne|Larve,Pious|Chafer,Craqueleur|Gelée,Dragodinde|Muldo,Bwork|Wabbit,Kralamoure|Moon,Comte Harebourg|Ougah,Forgelance|Iop"
};
const PAIRS={};for(const c in CATS)PAIRS[c]=CATS[c].split(",").map(p=>p.split("|"));

// ===== Utilitaires =====
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid=n=>Math.random().toString(36).slice(2,2+n);
const ROOM=(new URLSearchParams(location.search).get("salle")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
let code=ROOM, me=null, S=null, revealing=false;
const R=p=>ref(db,"rooms/"+code+(p?"/"+p:""));
const fail=m=>{app.innerHTML=`<div class="card err">${m}</div>`};

// ===== Accueil =====
async function home(){
 // reconnexion automatique si on était déjà dans cette salle (rechargement de page)
 const saved=code&&localStorage.getItem("imp_"+code);
 if(saved){me=saved;return enter()}
 app.innerHTML=`<div class="card">
 <p>${code?`Tu rejoins la salle <b>${esc(code)}</b>.`:"Crée une salle et envoie le lien à tes potes."}</p>
 <input id="nm" maxlength="16" placeholder="Ton pseudo">
 <button id="go">${code?"Rejoindre":"Créer la salle"}</button>
 <p id="er" class="err"></p></div>`;
 $("#nm").focus();
 $("#nm").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
 $("#go").onclick=async()=>{
  const name=$("#nm").value.trim();
  if(!name){$("#er").textContent="Entre un pseudo.";return}
  $("#go").disabled=true;$("#er").textContent="Connexion…";
  try{
   me=rid(10);
   if(!code){
    code=rid(5).toUpperCase();
    await set(R(),{host:me,phase:"lobby",round:0,created:Date.now()});
    history.replaceState(null,"","?salle="+code);
   }else{
    const snap=await get(R());
    if(!snap.exists()){$("#er").textContent="Salle introuvable. Vérifie le lien.";$("#go").disabled=false;return}
    const ps=Object.values(snap.val().players||{}).filter(p=>p.online);
    if(ps.length>=8){$("#er").textContent="La salle est pleine (8 max).";$("#go").disabled=false;return}
   }
   await set(R("players/"+me),{name,score:0,online:true,joined:Date.now()});
   localStorage.setItem("imp_"+code,me);
   enter();
  }catch(e){$("#er").textContent="Erreur de connexion : "+e.message;$("#go").disabled=false}
 };
}

async function enter(){
 try{
  const p=await get(R("players/"+me));
  if(!p.exists()){localStorage.removeItem("imp_"+code);me=null;return home()}
  onValue(ref(db,".info/connected"),c=>{
   if(c.val()!==true)return;
   onDisconnect(R("players/"+me+"/online")).set(false).then(()=>update(R("players/"+me),{online:true}));
  });
  onValue(R(),snap=>{S=snap.val();if(!S)return fail("Cette salle n'existe plus.");tick();render()});
  startChat();
 }catch(e){fail("Erreur de connexion : "+esc(e.message))}
}

// ===== Logique du chef =====
const isHost=()=>S&&S.host===me;
const online=()=>Object.entries(S.players||{}).filter(([,p])=>p.online).sort((a,b)=>a[1].joined-b[1].joined);

async function startRound(reroll){
 const ids=online().map(([id])=>id);
 const list=PAIRS[S.cat];
 let used=(S.used&&S.used[S.cat])||[];
 if(used.length>=list.length)used=[];
 let i;do{i=Math.floor(Math.random()*list.length)}while(used.includes(i));
 const pair=Math.random()<.5?list[i]:[list[i][1],list[i][0]];
 const imp=ids[Math.floor(Math.random()*ids.length)];
 const blank=S.mode==="blank";
 const words={};ids.forEach(id=>words[id]=id===imp?(blank?"__BLANK__":pair[1]):pair[0]);
 await update(R(),{phase:"vote",round:reroll===true?(S.round||1):(S.round||0)+1,words,order:[...ids].sort(()=>Math.random()-.5),turn:0,imp,civ:pair[0],impw:blank?null:pair[1],votes:null,result:null,["used/"+S.cat]:[...used,i]});
}
async function reveal(){
 if(revealing)return;revealing=true;
 const count={};for(const v of Object.values(S.votes||{}))count[v]=(count[v]||0)+1;
 const max=Math.max(0,...Object.values(count));
 const top=Object.keys(count).filter(k=>count[k]===max);
 const caught=top.length===1&&top[0]===S.imp;
 if(caught&&S.mode==="blank"&&S.words&&S.words[S.imp]==="__BLANK__"){
  await update(R(),{phase:"guess",result:{caught,count}});revealing=false;return;
 }
 const u={phase:"reveal",result:{caught,count}};
 for(const [id,p] of Object.entries(S.players||{})){
  if(!(S.words&&S.words[id]))continue;
  if(caught&&id!==S.imp)u["players/"+id+"/score"]=(p.score||0)+1;
  if(!caught&&id===S.imp)u["players/"+id+"/score"]=(p.score||0)+2;
 }
 await update(R(),u);revealing=false;
}
const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
async function submitGuess(g){
 const ok=norm(g)!==""&&norm(g)===norm(S.civ);
 const u={phase:"reveal",result:{...(S.result||{}),caught:true,guess:String(g).slice(0,40),guessed:ok}};
 for(const [id,p] of Object.entries(S.players||{})){
  if(!(S.words&&S.words[id]))continue;
  if(ok&&id===S.imp)u["players/"+id+"/score"]=(p.score||0)+2;
  if(!ok&&id!==S.imp)u["players/"+id+"/score"]=(p.score||0)+1;
 }
 await update(R(),u);
}
// le chef révèle automatiquement quand tout le monde a voté
function tick(){
 if(!isHost()||(S.phase!=="vote"&&S.phase!=="word"))return;
 const ids=online().map(([id])=>id).filter(id=>S.words&&S.words[id]);if(ids.length<2)return;
 if(ids.length&&ids.every(id=>S.votes&&S.votes[id]))reveal();
}
const A={
 cat:c=>update(R(),{cat:c}),
 start:()=>startRound(false),
 mode:m=>update(R(),{mode:m}),
 turnDone:()=>update(R(),{turn:(S.turn||0)+1}),
 turnAgain:()=>update(R(),{turn:0}),
 reroll:async()=>{
  if(!confirm("Changer les mots pour tout le monde ? Les votes seront remis à zéro."))return;
  await startRound(true);
  push(R("chat"),{by:"system",name:"🔄 Info",text:"Le chef a changé les mots. Regardez votre nouveau mot !",t:Date.now()});
 },
 toVote:()=>update(R(),{phase:"vote",votes:null}),
 reveal:reveal,
 next:()=>update(R(),{phase:"lobby",words:null,votes:null,imp:null,result:null}),
 vote:t=>set(R("votes/"+me),t)
};

// ===== Affichage =====
function playersList(showVote){
 return`<ul class="players">${online().map(([id,p])=>`<li><span>${esc(p.name)}${id===S.host?'<span class="tag">chef</span>':""}${id===me?'<span class="tag">toi</span>':""}</span><span>${showVote?(S.votes&&S.votes[id]?"✅":"⏳"):(p.score||0)+" pt"}</span></li>`).join("")}</ul>`;
}
function render(){
 const n=online().length,host=isHost(),myWord=S.words&&S.words[me];let h="";
 if(S.phase==="lobby"){
  if(host){
   const link=location.origin+location.pathname+"?salle="+code;
   h+=`<div class="card"><b>Lien à envoyer sur Discord :</b><div class="link" id="lk">${esc(link)}</div><button class="ghost" id="cp">Copier le lien</button></div>
   <div class="card"><b>Mode de jeu</b><div class="row tabs"><button data-m="classic" class="${S.mode!=="blank"?"sel":""}">🎭 Classique</button><button data-m="blank" class="${S.mode==="blank"?"sel":""}">❓ Sans mot</button></div><p class="mut">${S.mode==="blank"?"L'imposteur n'a AUCUN mot : il doit écouter les indices et deviner. S'il est démasqué, il a une dernière chance : deviner le mot des civils.":"L'imposteur a un mot proche de celui des civils, sans savoir qu'il est l'imposteur."}</p></div>
   <div class="card"><b>Choisis la catégorie</b><div class="row cats">${Object.keys(CATS).map(c=>`<button data-c="${esc(c)}" class="${S.cat===c?"sel":""}">${esc(c)}</button>`).join("")}</div>
   <button id="st" ${!S.cat||n<3?"disabled":""}>Lancer la manche</button><p class="mut">${n<3?"Il faut au moins 3 joueurs.":""}</p></div>`;
  }else h+=`<div class="card">En attente du chef… <br>Mode : <b>${S.mode==="blank"?"❓ Sans mot":"🎭 Classique"}</b>${S.cat?` · Catégorie : <b>${esc(S.cat)}</b>`:""}</div>`;
  h+=`<div class="card"><b>Joueurs (${n}/8)</b>${playersList(false)}</div>`;
 }
 else if(S.phase==="guess"){
  const imp=(S.players||{})[S.imp];
  if(me===S.imp)h+=`<div class="card"><div class="word" style="color:var(--acc)">Tu as été démasqué !</div><p>Dernière chance : devine le mot des civils pour gagner quand même.</p><form id="gf"><input id="gi" maxlength="40" placeholder="Ton mot…" autocomplete="off"><button>Valider</button></form></div>`;
  else h+=`<div class="card" style="text-align:center"><p class="mut">Démasqué !</p><div class="word">${esc(imp?imp.name:"?")}</div><p>L'imposteur n'avait pas de mot… il tente de deviner le vôtre ⏳</p>${host?'<button class="ghost" id="sk">⏭️ Il ne répond pas : terminer la manche</button>':""}</div>`;
  h+=`<div class="card"><b>Scores</b>${playersList(false)}</div>`;
 }
 else if(!myWord&&S.phase!=="reveal"){
  h+=`<div class="card">Une manche est en cours. Tu joueras à la prochaine !</div><div class="card"><b>Scores</b>${playersList(false)}</div>`;
 }
 else if(S.phase==="word"||S.phase==="vote"){
  const mv=S.votes&&S.votes[me];
  const order=(S.order||[]).filter(id=>S.players&&S.players[id]);
  const t=S.turn||0, cur=order[t], curName=cur?S.players[cur].name:"";
  if(order.length){
   if(cur){
    h+=`<div class="card turn ${cur===me?"mine":""}"><div class="mut">Tour ${t+1}/${order.length}</div><div class="tname">${cur===me?"🎤 C'est ton tour !":"C'est le tour de : <b>"+esc(curName)+"</b>"}</div>
    <p class="mut">Ordre : ${order.map((id,i)=>`<span style="${i===t?"color:var(--txt);font-weight:700":i<t?"text-decoration:line-through":""}">${esc(S.players[id].name)}</span>`).join(" → ")}</p>
    ${cur===me?'<button id="td">✅ J\'ai donné mon indice</button>':(host?'<button class="ghost" id="td">⏭️ Passer son tour</button>':"")}</div>`;
   }else{
    h+=`<div class="card turn"><div class="tname">🗳️ Tout le monde a parlé : votez !</div>${host?'<button class="ghost" id="ta">🔁 Nouveau tour d\'indices</button>':""}</div>`;
   }
  }
  h+=`<div class="card"><p class="mut">Manche ${S.round} · ${esc(S.cat)} · ton mot (ne le montre à personne) :</p>${myWord==="__BLANK__"?`<div class="word" style="color:var(--acc)">🕵️ Tu es l'imposteur !</div><p>Tu n'as pas de mot. Écoute les indices des autres, invente des indices crédibles et essaie de deviner le mot.</p>`:`<div class="word">${esc(myWord)}</div>`}<p class="mut">Donnez vos indices sur Discord ou dans le chat, puis votez. Tu peux changer ton vote tant que tout le monde n'a pas voté.</p></div>
  <div class="card"><b>🗳️ Qui est l'imposteur ?</b><div class="vote">${online().filter(([id])=>id!==me&&S.words&&S.words[id]).map(([id,p])=>`<button data-v="${id}" class="${mv===id?"sel":""}">${esc(p.name)}</button>`).join("")}</div></div>
  <div class="card"><b>Votes</b>${playersList(true)}${host?'<button class="red" id="rv">Révéler maintenant</button> <button class="ghost" id="rr">🔄 Changer les mots</button>':""}</div>`;
 }
 else if(S.phase==="reveal"){
  const r=S.result||{count:{}},imp=(S.players||{})[S.imp];
  if(myWord){
   const impWins=!r.caught||!!r.guessed;const won=(me===S.imp)===impWins;
   h+=`<div class="result ${won?"win":"lose"}">${won?"🏆 Vous avez gagné !":"💀 Vous avez perdu…"}</div>`;
  }
  h+=`<div class="card" style="text-align:center"><p class="mut">L'imposteur était…</p><div class="word">${esc(imp?imp.name:"?")}</div>
  <p>${!r.caught?"😈 Il s'en sort ! +2 points pour l'imposteur.":r.guess!==undefined?(r.guessed?`🧠 Démasqué… mais il a deviné « ${esc(r.guess)} » ! +2 points pour l'imposteur.`:(r.guess?`🎯 Démasqué, et il a proposé « ${esc(r.guess)} » : raté ! +1 point pour chaque civil.`:"🎯 Démasqué, et il n'a pas répondu ! +1 point pour chaque civil.")):"🎯 Démasqué ! +1 point pour chaque civil."}</p>
  <p class="mut">Mot des civils : <b>${esc(S.civ)}</b> · Mot de l'imposteur : <b>${S.impw?esc(S.impw):"aucun"}</b></p></div>
  <div class="card"><b>Votes reçus</b><ul class="players">${online().map(([id,p])=>`<li><span>${esc(p.name)}</span><span>${(r.count||{})[id]||0}</span></li>`).join("")}</ul></div>
  <div class="card"><b>Scores</b>${playersList(false)}${host?'<button id="nx">Manche suivante</button>':'<p class="mut">Le chef lance la manche suivante.</p>'}</div>`;
 }
 const keep=$("#gi")?$("#gi").value:null;
 app.innerHTML=h;
 if(keep!==null&&$("#gi"))$("#gi").value=keep;
 document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>A.cat(b.dataset.c));
 document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>A.vote(b.dataset.v));
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on("#st",A.start);on("#tv",A.toVote);on("#rv",A.reveal);on("#nx",A.next);on("#rr",A.reroll);on("#td",A.turnDone);on("#ta",A.turnAgain);on("#sk",()=>{if(confirm("Terminer sans réponse ? Ça compte comme une mauvaise réponse."))submitGuess("")});
 document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>A.mode(b.dataset.m));
 const gf=$("#gf");if(gf){$("#gi").focus();gf.onsubmit=e=>{e.preventDefault();const g=$("#gi").value.trim();if(g){gf.querySelector("button").disabled=true;submitGuess(g)}}}
 on("#cp",()=>{navigator.clipboard.writeText($("#lk").textContent);$("#cp").textContent="Copié ✓"});
}
// ===== Chat (séparé de l'affichage du jeu pour ne pas effacer ce qu'on tape) =====
function startChat(){
 $("#chat").hidden=false;
 const box=$("#msgs");
 onValue(query(R("chat"),limitToLast(60)),snap=>{
  const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<40;
  const list=[];snap.forEach(c=>{list.push(c.val())});
  box.innerHTML=list.map(m=>`<p class="${m.by===me?"mine":""}"><b>${esc(m.name)} :</b> ${esc(m.text)}</p>`).join("")||'<p class="mut">Aucun message pour l\'instant.</p>';
  if(atBottom||list.length&&list[list.length-1].by===me)box.scrollTop=box.scrollHeight;
 });
 $("#cf").onsubmit=e=>{
  e.preventDefault();
  const text=$("#ci").value.trim();if(!text)return;
  const p=S&&S.players&&S.players[me];
