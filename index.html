<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imposteur</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>if(!window.Peer)document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--line:#2a2e3b;--txt:#e8e8ee;--mut:#9095a8;--acc:#e5484d;--ok:#3dd68c;--btn:#2b6cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:560px}
h1{font-size:28px;margin:0 0 4px}h1 span{color:var(--acc)}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#11131a;color:var(--txt);font-size:16px}
button{padding:12px 16px;border:0;border-radius:8px;background:var(--btn);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
button:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
button.red{background:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.cats button{flex:1 1 45%;background:#232735;border:2px solid transparent}
.cats button.sel{border-color:var(--btn);background:#1f2a4a}
.players li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.players{list-style:none;padding:0;margin:0}
.word{font-size:34px;font-weight:800;text-align:center;padding:24px 0;letter-spacing:.5px}
.mut{color:var(--mut);font-size:14px}
.link{word-break:break-all;background:#11131a;padding:10px;border-radius:8px;font-size:14px}
.vote button{display:block;width:100%;text-align:left;background:#232735}
.vote button.sel{background:var(--acc)}
.err{color:var(--acc)}
.tag{font-size:12px;background:#2a2e3b;padding:2px 8px;border-radius:99px;margin-left:6px}
</style>
</head>
<body>
<main>
<h1>L'<span>Imposteur</span></h1>
<p class="sub">Tout le monde a le même mot… sauf un.</p>
<div id="app"></div>
</main>
<script>
// ===== Paires de mots (proches mais différents) =====
const CATS={
 "Animes":"Naruto|Bleach,One Piece|Fairy Tail,Death Note|Code Geass,Attack on Titan|Tokyo Ghoul,Dragon Ball Z|Dragon Ball Super,Hunter x Hunter|Jujutsu Kaisen,Demon Slayer|Jujutsu Kaisen,My Hero Academia|One Punch Man,Fullmetal Alchemist|Fire Force,Sword Art Online|Log Horizon,Haikyuu|Kuroko no Basket,Chainsaw Man|Hell's Paradise,Spy x Family|Kaguya-sama,Vinland Saga|Berserk,Dr. Stone|Fullmetal Alchemist,Black Clover|Fairy Tail,Mob Psycho 100|One Punch Man,Solo Leveling|Sword Art Online,Blue Lock|Captain Tsubasa,Pokémon|Digimon",
 "Personnages LoL":"Ahri|Lux,Yasuo|Yone,Garen|Darius,Ashe|Sejuani,Jinx|Vi,Zed|Shen,Thresh|Blitzcrank,Lee Sin|Udyr,Teemo|Rumble,Katarina|Talon,Ezreal|Lucian,Caitlyn|Jhin,Annie|Brand,Morgana|Kayle,Nasus|Renekton,Riven|Fiora,Leona|Diana,Master Yi|Tryndamere,Draven|Darius,Kai'Sa|Kha'Zix,Malphite|Galio,Sona|Seraphine",
 "Objets":"Fourchette|Cuillère,Chaise|Tabouret,Stylo|Crayon,Téléphone|Tablette,Oreiller|Coussin,Brosse à dents|Peigne,Lampe|Bougie,Montre|Bracelet,Valise|Sac à dos,Tasse|Verre,Ciseaux|Couteau,Clé|Cadenas,Parapluie|Imperméable,Miroir|Fenêtre,Casque|Écouteurs,Clavier|Manette,Réfrigérateur|Congélateur,Marteau|Tournevis,Livre|Cahier,Ballon|Raquette,Tapis|Serviette,Bouteille|Gourde",
 "Jeux vidéo":"League of Legends|Dota 2,Rocket League|FIFA,Fortnite|PUBG,Minecraft|Terraria,Call of Duty|Battlefield,GTA V|Red Dead Redemption,Valorant|Counter-Strike,The Witcher 3|Skyrim,Mario Kart|Crash Team Racing,Dofus|Wakfu,Overwatch|Apex Legends,Elden Ring|Dark Souls,Pokémon|Yu-Gi-Oh,Clash Royale|Clash of Clans,Among Us|Fall Guys,Zelda|Final Fantasy,Hollow Knight|Celeste,Tetris|Candy Crush,Street Fighter|Tekken,Rematch|Rocket League,World of Warcraft|Dofus",
 "Personnages Dofus":"Iop|Sacrieur,Crâ|Ouginak,Eniripsa|Sadida,Sram|Roublard,Xélor|Eliotrope,Ecaflip|Enutrof,Féca|Pandawa,Osamodas|Sadida,Zobal|Steamer,Huppermage|Xélor,Bouftou|Tofu,Bouftou royal|Tofu royal,Arakne|Larve,Pious|Chafer,Craqueleur|Gelée,Dragodinde|Muldo,Bwork|Wabbit,Kralamoure|Moon,Comte Harebourg|Ougah,Forgelance|Iop"
};
const PAIRS={};for(const c in CATS)PAIRS[c]=CATS[c].split(",").map(p=>p.split("|"));

// ===== Utilitaires =====
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const code=()=>Math.random().toString(36).slice(2,7).toUpperCase();
const PREFIX="imposteur-jeu-v1-";
const room=new URLSearchParams(location.search).get("salle");

let peer, isHost=false, myId=null, view={phase:"connect"};

// ===== Écran d'accueil =====
function home(){
 app.innerHTML=`<div class="card">
 <p>${room?`Tu rejoins la salle <b>${esc(room)}</b>.`:"Crée une salle et envoie le lien à tes potes."}</p>
 <input id="nm" maxlength="16" placeholder="Ton pseudo">
 <button id="go">${room?"Rejoindre":"Créer la salle"}</button>
 <p id="er" class="err"></p></div>`;
 $("#nm").focus();
 $("#nm").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
 $("#go").onclick=()=>{
  const n=$("#nm").value.trim();
  if(!n){$("#er").textContent="Entre un pseudo.";return}
  if(!window.Peer){$("#er").textContent="La bibliothèque de connexion n'a pas pu se charger. Ouvre le site depuis son adresse en ligne (Vercel) ou dans Chrome/Firefox, pas dans un aperçu.";return}
  $("#go").disabled=true;$("#er").textContent="Connexion…";
  room?join(n):host(n);
 };
}

// ===== HÔTE : il garde l'état du jeu =====
const S={players:[],phase:"lobby",cat:null,pair:null,imp:null,votes:{},used:{},round:0,civWord:null,impWord:null};
const conns={};
function host(name){
 isHost=true;const c=code();
 peer=new Peer(PREFIX+c);
 peer.on("open",id=>{myId=id;S.room=c;S.players.push({id,name,score:0});broadcast()});
 peer.on("connection",conn=>{
  conn.on("data",m=>onHostMsg(conn,m));
  conn.on("close",()=>{S.players=S.players.filter(p=>p.id!==conn.peer);delete conns[conn.peer];delete S.votes[conn.peer];broadcast()});
 });
 peer.on("error",e=>{app.innerHTML=`<div class="card err">Erreur : ${esc(e.type)}. Recharge la page.</div>`});
}
function onHostMsg(conn,m){
 if(m.t==="join"){
  if(S.players.length>=8){conn.send({t:"full"});return}
  let n=String(m.name).slice(0,16);
  if(S.players.some(p=>p.name===n))n+=" "+(S.players.length+1);
  conns[conn.peer]=conn;S.players.push({id:conn.peer,name:n,score:0});broadcast();
 }
 if(m.t==="vote"&&S.phase==="vote")doVote(conn.peer,m.target);
}
function doVote(from,target){
 if(from===target||!S.players.some(p=>p.id===target))return;
 S.votes[from]=target;
 if(Object.keys(S.votes).length>=S.players.length)reveal();else broadcast();
}
function startRound(){
 const list=PAIRS[S.cat];S.used[S.cat]=S.used[S.cat]||[];
 if(S.used[S.cat].length>=list.length)S.used[S.cat]=[];
 let i;do{i=Math.floor(Math.random()*list.length)}while(S.used[S.cat].includes(i));
 S.used[S.cat].push(i);
 const pair=Math.random()<.5?list[i]:[list[i][1],list[i][0]];
 S.civWord=pair[0];S.impWord=pair[1];
 S.imp=S.players[Math.floor(Math.random()*S.players.length)].id;
 S.votes={};S.phase="word";S.round++;broadcast();
}
function reveal(){
 const count={};for(const v of Object.values(S.votes))count[v]=(count[v]||0)+1;
 const max=Math.max(0,...Object.values(count));
 const top=Object.keys(count).filter(k=>count[k]===max);
 S.caught=top.length===1&&top[0]===S.imp;
 for(const p of S.players){
  if(S.caught&&p.id!==S.imp)p.score+=1;
  if(!S.caught&&p.id===S.imp)p.score+=2;
 }
 S.count=count;S.phase="reveal";broadcast();
}
function stateFor(id){
 return{t:"state",room:S.room,phase:S.phase,cat:S.cat,round:S.round,
  players:S.players.map(p=>({id:p.id,name:p.name,score:p.score,voted:p.id in S.votes})),
  myWord:S.phase==="word"||S.phase==="vote"?(id===S.imp?S.impWord:S.civWord):null,
  myVote:S.votes[id]||null,
  reveal:S.phase==="reveal"?{imp:S.imp,civ:S.civWord,impw:S.impWord,caught:S.caught,count:S.count}:null,
  hostId:myId};
}
function broadcast(){
 for(const id in conns)if(conns[id].open)conns[id].send(stateFor(id));
 view=stateFor(myId);render();
}
// actions locales de l'hôte
const H={
 cat:c=>{S.cat=c;broadcast()},
 start:()=>startRound(),
 toVote:()=>{S.phase="vote";S.votes={};broadcast()},
 reveal:()=>reveal(),
 next:()=>{S.phase="lobby";broadcast()}
};

// ===== JOUEUR =====
let hostConn;
function join(name){
 peer=new Peer();
 peer.on("open",id=>{
  myId=id;hostConn=peer.connect(PREFIX+room,{reliable:true});
  hostConn.on("open",()=>hostConn.send({t:"join",name}));
  hostConn.on("data",m=>{
   if(m.t==="full"){app.innerHTML=`<div class="card err">La salle est pleine (8 max).</div>`;return}
   if(m.t==="state"){view=m;render()}
  });
  hostConn.on("close",()=>{app.innerHTML=`<div class="card err">L'hôte a quitté la partie.</div>`});
 });
 peer.on("error",e=>{app.innerHTML=`<div class="card err">${e.type==="peer-unavailable"?"Salle introuvable. Vérifie le lien, ou l'hôte a fermé son onglet.":"Erreur de connexion : "+esc(e.type)}</div>`});
}
function act(a,arg){
 if(isHost){a==="vote"?doVote(myId,arg):H[a](arg);return}
 if(a==="vote")hostConn.send({t:"vote",target:arg});
}

// ===== Affichage =====
function playersList(showVote){
 return`<ul class="players">${view.players.map(p=>`<li><span>${esc(p.name)}${p.id===view.hostId?'<span class="tag">chef</span>':""}${p.id===myId?'<span class="tag">toi</span>':""}</span><span>${showVote?(p.voted?"✅":"⏳"):p.score+" pt"}</span></li>`).join("")}</ul>`;
}
function render(){
 const v=view,n=v.players.length;let h="";
 if(v.phase==="lobby"){
  if(isHost){
   const link=location.origin+location.pathname+"?salle="+v.room;
   h+=`<div class="card"><b>Lien à envoyer sur Discord :</b><div class="link" id="lk">${esc(link)}</div><button class="ghost" id="cp">Copier le lien</button></div>`;
   h+=`<div class="card"><b>Choisis la catégorie</b><div class="row cats">${Object.keys(CATS).map(c=>`<button data-c="${esc(c)}" class="${v.cat===c?"sel":""}">${esc(c)}</button>`).join("")}</div>
   <button id="st" ${!v.cat||n<3?"disabled":""}>Lancer la manche</button><p class="mut">${n<3?"Il faut au moins 3 joueurs.":""}</p></div>`;
  }else h+=`<div class="card">En attente du chef… ${v.cat?`Catégorie : <b>${esc(v.cat)}</b>`:""}</div>`;
  h+=`<div class="card"><b>Joueurs (${n}/8)</b>${playersList(false)}</div>`;
 }
 if(v.phase==="word"){
  h+=`<div class="card"><p class="mut">Manche ${v.round} · ${esc(v.cat)} · ton mot (ne le montre à personne) :</p><div class="word">${esc(v.myWord)}</div>
  <p class="mut">Chacun donne un indice à tour de rôle sur Discord. Tu ne sais pas si tu es l'imposteur !</p>
  ${isHost?'<button id="tv">Passer au vote</button>':""}</div>`;
  h+=`<div class="card"><b>Scores</b>${playersList(false)}</div>`;
 }
 if(v.phase==="vote"){
  h+=`<div class="card"><p class="mut">Ton mot : <b>${esc(v.myWord)}</b></p><b>Qui est l'imposteur ?</b><div class="vote">${v.players.filter(p=>p.id!==myId).map(p=>`<button data-v="${p.id}" class="${v.myVote===p.id?"sel":""}">${esc(p.name)}</button>`).join("")}</div></div>`;
  h+=`<div class="card"><b>Votes</b>${playersList(true)}${isHost?'<button class="red" id="rv">Révéler maintenant</button>':""}</div>`;
 }
 if(v.phase==="reveal"){
  const r=v.reveal,imp=v.players.find(p=>p.id===r.imp);
  h+=`<div class="card" style="text-align:center"><p class="mut">L'imposteur était…</p><div class="word">${esc(imp?imp.name:"(parti)")}</div>
  <p>${r.caught?"🎯 Démasqué ! +1 point pour chaque civil.":"😈 Il s'en sort ! +2 points pour l'imposteur."}</p>
  <p class="mut">Mot des civils : <b>${esc(r.civ)}</b> · Mot de l'imposteur : <b>${esc(r.impw)}</b></p></div>`;
  h+=`<div class="card"><b>Votes reçus</b><ul class="players">${v.players.map(p=>`<li><span>${esc(p.name)}</span><span>${r.count[p.id]||0}</span></li>`).join("")}</ul></div>`;
  h+=`<div class="card"><b>Scores</b>${playersList(false)}${isHost?'<button id="nx">Manche suivante</button>':'<p class="mut">Le chef lance la manche suivante.</p>'}</div>`;
 }
 app.innerHTML=h;
 document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>act("cat",b.dataset.c));
 document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>act("vote",b.dataset.v));
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on("#st",()=>act("start"));on("#tv",()=>act("toVote"));on("#rv",()=>act("reveal"));on("#nx",()=>act("next"));
 on("#cp",()=>{navigator.clipboard.writeText($("#lk").textContent);$("#cp").textContent="Copié ✓"});
}
window.addEventListener("beforeunload",e=>{if(isHost&&view.players&&view.players.length>1){e.preventDefault();e.returnValue=""}});
home();
</script>
</body>
</html>
